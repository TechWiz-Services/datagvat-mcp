name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Dockerfile's test stage installs the pinned dependencies and runs the offline test suite.
      - run: docker build --target test --tag datagvat-mcp:test .
