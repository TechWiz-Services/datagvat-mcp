[project]
name = "datagvat-mcp"
version = "2.0.0"
description = "Self-hosted MCP server for Austrian Open Government Data (data.gv.at)"
readme = "README.md"
requires-python = ">=3.12"
# Exact, hash-verified pins live in requirements.txt (used by the Docker build).
dependencies = [
    "mcp==1.25.0",
    "httpx==0.28.1",
    "pydantic-settings==2.12.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider --strict-markers"
markers = ["live: talks to the real data.gv.at API (run with DATAGVAT_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"
