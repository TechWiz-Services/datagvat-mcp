services:
  datagvat-mcp:
    build: .
    image: datagvat-mcp:latest
    container_name: datagvat-mcp
    restart: unless-stopped
    ports:
      - "${DATAGVAT_PORT:-8000}:${DATAGVAT_PORT:-8000}"   # remove when only Traefik should reach the container
    # Every setting can be changed in .env (see .env.example); the values after ":-" are the defaults.
    # The README explains each one.
    environment:
      # --- Access ---------------------------------------------------------
      # Required. Clients must send "Authorization: Bearer <token>"; the server does not start without it.
      DATAGVAT_AUTH_TOKEN: ${DATAGVAT_AUTH_TOKEN:?set DATAGVAT_AUTH_TOKEN in .env}
      # Only accept these Host headers (DNS-rebinding protection), comma-separated. Empty: off.
      DATAGVAT_ALLOWED_HOSTS: ${DATAGVAT_ALLOWED_HOSTS:-}
      DATAGVAT_HOST: ${DATAGVAT_HOST:-0.0.0.0}
      DATAGVAT_PORT: ${DATAGVAT_PORT:-8000}
      DATAGVAT_PATH: ${DATAGVAT_PATH:-/mcp}
      DATAGVAT_STATELESS: ${DATAGVAT_STATELESS:-false}
      DATAGVAT_LOG_LEVEL: ${DATAGVAT_LOG_LEVEL:-INFO}
      # Trust X-Forwarded-* from your proxy network (for correct client IPs in logs), e.g. 172.16.0.0/12.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

      # --- Politeness towards data.gv.at -----------------------------------
      # Required. An e-mail/URL added to the User-Agent so data.gv.at can contact you; the server does not
      # start without it.
      DATAGVAT_CONTACT: ${DATAGVAT_CONTACT:?set DATAGVAT_CONTACT in .env}
      # Seconds to pause after each answer from data.gv.at (minimum 0.5). Requests are never sent in parallel.
      DATAGVAT_REQUEST_INTERVAL: ${DATAGVAT_REQUEST_INTERVAL:-2}
      # The same pause (minimum 0.5) for downloads from each publisher's file server.
      DATAGVAT_PREVIEW_REQUEST_INTERVAL: ${DATAGVAT_PREVIEW_REQUEST_INTERVAL:-2}
      DATAGVAT_QUEUE_TIMEOUT: ${DATAGVAT_QUEUE_TIMEOUT:-30}
      DATAGVAT_REQUEST_TIMEOUT: ${DATAGVAT_REQUEST_TIMEOUT:-30}
      DATAGVAT_API_BASE: ${DATAGVAT_API_BASE:-https://www.data.gv.at/api/hub/search}
      DATAGVAT_LANGUAGE: ${DATAGVAT_LANGUAGE:-de}

      # --- Previews of data files ------------------------------------------
      DATAGVAT_PREVIEW_MAX_BYTES: ${DATAGVAT_PREVIEW_MAX_BYTES:-524288}
      DATAGVAT_PREVIEW_BLOCKED_HOSTS: ${DATAGVAT_PREVIEW_BLOCKED_HOSTS-ris.bka.gv.at,data.bka.gv.at}

      # --- Cache (lifetimes in seconds, sizes in MB; 0 switches a kind off) -
      DATAGVAT_CACHE_ENABLED: ${DATAGVAT_CACHE_ENABLED:-true}
      DATAGVAT_CACHE_DIR: ${DATAGVAT_CACHE_DIR:-/cache}
      DATAGVAT_CACHE_SEARCH_TTL: ${DATAGVAT_CACHE_SEARCH_TTL:-21600}
      DATAGVAT_CACHE_SEARCH_MAX_MB: ${DATAGVAT_CACHE_SEARCH_MAX_MB:-64}
      DATAGVAT_CACHE_DATASET_TTL: ${DATAGVAT_CACHE_DATASET_TTL:-604800}
      DATAGVAT_CACHE_DATASET_MAX_MB: ${DATAGVAT_CACHE_DATASET_MAX_MB:-128}
      DATAGVAT_CACHE_CATALOGUE_TTL: ${DATAGVAT_CACHE_CATALOGUE_TTL:-604800}
      DATAGVAT_CACHE_CATALOGUE_MAX_MB: ${DATAGVAT_CACHE_CATALOGUE_MAX_MB:-16}
      DATAGVAT_CACHE_VOCABULARY_TTL: ${DATAGVAT_CACHE_VOCABULARY_TTL:-2592000}
      DATAGVAT_CACHE_VOCABULARY_MAX_MB: ${DATAGVAT_CACHE_VOCABULARY_MAX_MB:-32}
      DATAGVAT_CACHE_PREVIEW_TTL: ${DATAGVAT_CACHE_PREVIEW_TTL:-3600}
      DATAGVAT_CACHE_PREVIEW_MAX_MB: ${DATAGVAT_CACHE_PREVIEW_MAX_MB:-64}
      # How long past its lifetime an answer is kept for when the source cannot be reached.
      DATAGVAT_CACHE_MAX_STALE: ${DATAGVAT_CACHE_MAX_STALE:-2592000}
    read_only: true
    volumes:
      - datagvat-cache:/cache   # saved answers; keeps the cache across updates
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    # Traefik example (adjust router name, host, entrypoint, certresolver and network):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.datagvat-mcp.rule=Host(`datagvat-mcp.example.com`)
    #   - traefik.http.routers.datagvat-mcp.entrypoints=websecure
    #   - traefik.http.routers.datagvat-mcp.tls.certresolver=letsencrypt
    #   - traefik.http.services.datagvat-mcp.loadbalancer.server.port=8000

volumes:
  datagvat-cache:
