services:
  datagvat-mcp:
    build: .
    image: datagvat-mcp:latest
    container_name: datagvat-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"   # remove when only Traefik should reach the container
    environment:
      # Clients must send "Authorization: Bearer <token>". Strongly recommended.
      DATAGVAT_AUTH_TOKEN: ${DATAGVAT_AUTH_TOKEN:-}
      # Optional: an e-mail/URL added to the User-Agent so data.gv.at can contact you.
      DATAGVAT_CONTACT: ${DATAGVAT_CONTACT:-}
      # Optional: only accept these Host headers (DNS-rebinding protection), comma-separated.
      # DATAGVAT_ALLOWED_HOSTS: datagvat-mcp.example.com
      # Trust X-Forwarded-* from your proxy network (for correct client IPs in logs).
      # FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    # Traefik example (adjust router name, host, entrypoint, certresolver and network):
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.datagvat-mcp.rule=Host(`datagvat-mcp.example.com`)
    #   - traefik.http.routers.datagvat-mcp.entrypoints=websecure
    #   - traefik.http.routers.datagvat-mcp.tls.certresolver=letsencrypt
    #   - traefik.http.services.datagvat-mcp.loadbalancer.server.port=8000
